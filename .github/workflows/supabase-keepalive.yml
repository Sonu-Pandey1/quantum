name: Supabase Keep-Alive Pulse

on:
  schedule:
    # Runs at 00:00 every 4 days to keep Supabase active and prevent pausing
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keepalive Ping to Supabase REST API
        run: |
          curl -f -s -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          echo "Supabase keep-alive ping dispatched successfully."

